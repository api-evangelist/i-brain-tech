name: i-Brain Tech
description: >-
  i-Brain Tech is a neuroscience company building a brain-controlled training platform for
  sports performance. Its core product is a video game driven exclusively by an athlete's brain
  impulses through motor-imagery and neurofeedback, requiring no physical movement. The platform
  is applied to three areas: post-injury neuromuscular recovery and return-to-play readiness,
  player development through cognitive and tactical training without physical strain, and
  cognitive assessment that surfaces mental resilience, attention, and endurance from real brain
  data. Elite football clubs including Real Sociedad, Juventus FC, CD Leganes, Olympique
  Lyonnais, S.L. Benfica, and Seattle Reign FC use the platform. i-Brain Tech is a Techstars
  portfolio company. It currently exposes no public developer API, SDK, or documentation surface;
  this profile captures its public identity and domain-security posture in the API Evangelist
  network.
